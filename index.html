  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
  <script>
    toggleInput.onclick=event=>
      toggleInput.style.textDecorationLine=toggleInput.style.textDecorationLine?
        ``:`grammar-error`;

    note.onclick=event=>
      note.placeholder=note.placeholder?
        ``:`輸入筆記(例如UID、這是誰的紀錄)`;

    const startTime = async function() {
        while( toggleInput.style.textDecorationLine
        || document.activeElement === clock
        || document.activeElement === copyBtn
        || document.activeElement === saveBtn ){
          if(!toggleInput.style.textDecorationLine)
            toggleInput.style.textDecorationLine = `grammar-error`;
          await new Promise(requestAnimationFrame);
        }
        clock.value = new Date(new Date-new Date().getTimezoneOffset()*6e4).toISOString().split('.')[0];
        setTimeout(startTime, 1e3 - new Date() % 1e3);
      };

    let returnee = false;

    async function copyNow(save=true) {
      var copyText = new Date().getTimezoneOffset()*60+clock.valueAsNumber/1e3;
      const ctime = copyText*1e3, d1 = 1e3*60*60*24, options = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      };

      if(!save) navigator.clipboard.writeText(copyText);
      copyedBlock.innerHTML = `
        已複製「<span style="user-select:all">${copyText}</span>」
        (${new Date(ctime).toLocaleTimeString(undefined, options)})`;// copy

      quitTimeBlock.innerHTML = `
        <span style="user-select:all">
          ${parseInt(new Date(d1*( returnee?(60-45):(45-14) )+ctime)/1e3)}
        </span>
        (${new Date(d1*( returnee?(60-45):(45-14) )+ctime).toLocaleTimeString(undefined, options)})
      `;// 下次登出時間

      backTimeBlock.innerHTML = `
        <span style="user-select:all">
          ${parseInt(new Date(d1*(returnee?60:45)+ctime)/1e3)}
        </span>
        (${new Date(d1*(returnee?60:45)+ctime).toLocaleTimeString(undefined, options)})
      `;// 下次回歸時間

      quitInfoBlock.style.top=`5.5rem`;
      quitInfoBlock.innerHTML = `
        登出${returnee?`<font color="#f78a2d">45天後</font>`:`兩個禮拜以後`}
        <span style="user-select:all">
          ${parseInt(new Date(d1*(returnee?45:14)+ctime)/1e3)}</span>
        (${new Date(d1*(returnee?45:14)+ctime).toLocaleTimeString(undefined, options)})
        <br> 登出${returnee?`<font color="#f78a2d">15天前</font>`:`31天前`}
        <span style="user-select:all">
          ${parseInt(new Date( ctime-d1* (returnee?15:31) )/1e3)}</span>
        (${new Date( ctime-d1* (returnee?15:31) ).toLocaleTimeString(undefined, options)})
      `;// 登出時計算

      for(const e of document.querySelectorAll(`span`)){
        e.addEventListener(`click`,event=>navigator.clipboard.writeText(event.target.innerText),true);
      }

      if(save){
        Object.assign(pic.style, {
          left: `-1.6rem`,
          top: `-1.1rem`,
        });
        note.placeholder = ``;
        // https://github.com/tsayen/dom-to-image#usage
        domtoimage.toBlob(scene)
          .then(function (blob) {
              window.saveAs(blob, `${copyText}.png`);
              Object.assign(pic.style, {
                left: ``,
                top: ``,
              });
              note.placeholder = `輸入筆記(例如UID、這是誰的紀錄)`;
          });
      }
    }

    copyBtn.onclick=copyNow(false);
    saveBtn.onclick=copyNow(true);

    formModal.addEventListener(`submit`, async event => {
      if (event.defaulPrevented) return;
      event.preventDefault();
      copyNow(true);
    }, true);

    returneeGiftsBtn.addEventListener(`click`, async event => {
      if(returnee = !returnee){
        event.target.style.boxShadow = `inset 0px 0px 10px 3px #fee27b`;
        IntertwinedFate.style.display=`block`;
        quitInfoBlock.innerHTML=`<font color="#f78a2d">觸發條件：冒險等階30級以上、45天以上未登入遊戲且60天以上未觸發「歸途贈禮」</font>`;
        quitTimeLabel.innerHTML=`下次登出時間<br><font color="#f78a2d">(15天後)</font>`;
        backTimeLabel.innerHTML=`下次回歸時間<br><font color="#f78a2d">(60天後)</font>`;
      } else {
        event.target.style.boxShadow = `inherit`;
        document.querySelector(`#IntertwinedFate`).style.display=`none`;
        quitInfoBlock.innerHTML=`觸發條件：冒險等階10級以上、14天以上未登入遊戲且45天以上未觸發「星之歸還」`;
        quitTimeLabel.innerHTML=`下次登出時間<br>(31天後)`;
        backTimeLabel.innerHTML=`下次回歸時間<br>(45天後)`;
      }
      quitInfoBlock.style.removeProperty(`top`);
      copyedBlock.innerHTML=`
        <a href="https://github.com/twjmy" target="_blank">作者<i class="fa-brands fa-fw fa-github"></i>twjmy</a>
        媒體資源皆取自<a href="https://hoyo.link/4zRkFHAL" target="_blank">©原神官方先行展示網頁</a>`;
      quitTimeBlock.innerHTML=`🖱️複製後計算<br><font color="red">※觸發時計算看</font>上面`;
      backTimeBlock.innerHTML=`🖱️複製後計算<br><font color="red">※登出時計算看</font><font color="#627a90">下面</font>`;
    }, true);

    screen.orientation.lock('landscape');
  </script>
